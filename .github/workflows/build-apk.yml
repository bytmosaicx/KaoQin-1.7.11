name: Build KaoQin APK

on:
  push:
    branches: [main, master]
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract the 1.7.57 cloud backup source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./KaoQin_1.7.57_CloudBackup_NetworkPermission.zip"
          test -f "$ZIP_FILE" || { echo "1.7.57 source ZIP not found"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR" || { echo "settings.gradle or settings.gradle.kts not found"; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "app Gradle build file not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Decode and verify signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kaoqin-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/kaoqin-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kaoqin-release.jks" >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$PROJECT_DIR/app/build.gradle" <<'GRADLE'

          // CI release signing configuration; injected only during the GitHub Actions build.
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: KaoQin-1.7.57-CloudBackup-release-apk
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error
